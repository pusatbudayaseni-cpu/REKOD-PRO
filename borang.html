<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Borang Permohonan Pinjaman Kunci</title>
<style>
:root{--bg:#f4f7f2;--card:#fff;--ink:#1c2b21;--mute:#5d6e63;--line:#dfe7dc;--brand:#2f8f4e;--brand-ink:#fff;--bad:#b4531a}
@media (prefers-color-scheme:dark){:root{--bg:#111a14;--card:#1a251d;--ink:#e8f1ea;--mute:#9bb0a1;--line:#2b3a2f;--brand:#4cbf70;--brand-ink:#0c1a11;--bad:#ffb27a;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
main{max-width:560px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:1.4rem;margin:4px 0 2px}
.sub{color:var(--mute);margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
label.f{display:block;margin-top:14px;font-weight:600;font-size:.92rem}
label.f small{font-weight:400;color:var(--mute)}
input[type=text],input[type=tel],input[type=date],select,textarea{width:100%;margin-top:4px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
textarea{min-height:76px;resize:vertical}
.go{margin-top:18px;width:100%;padding:14px;border:0;border-radius:12px;background:var(--brand);color:var(--brand-ink);font-weight:700;font-size:1rem;cursor:pointer}
.go:disabled{opacity:.5}
.msg{margin-top:10px;font-size:.92rem;min-height:1.2em}
.err{color:var(--bad)}
.hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
.ok{text-align:center;padding:10px 0}
.ok .big{font-size:3rem}
.hidden{display:none!important}
.mute{color:var(--mute)}
.kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px;margin-top:8px}
.kcard{position:relative;border:2px solid var(--line);border-radius:12px;background:var(--card);overflow:hidden;cursor:pointer;user-select:none;-webkit-user-select:none}
.kcard img,.kcard .noimg{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.kcard .noimg{display:flex;align-items:center;justify-content:center;font-size:2.4rem;background:var(--line)}
.kcard .kn{padding:6px 8px 8px}
.kcard .kn b{display:block;overflow-wrap:anywhere;font-size:.9rem}
.kcard .kn small{display:block;font-size:.75rem;color:var(--mute)}
.kcard .kn small.ok2{color:var(--brand);font-weight:600}
.kcard.sel{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand) inset}
.kcard.off{background:var(--line);cursor:not-allowed}
.kcard.off img,.kcard.off .noimg,.kcard.off .kn{filter:grayscale(1);opacity:.45}
.kcard .kchk{position:absolute;top:6px;left:6px;width:24px;height:24px;margin:0;accent-color:var(--brand);pointer-events:none}
</style>
</head>
<body>
<main>
  <h1>🔑 Borang Permohonan Pinjaman Kunci</h1>
  <p class="sub">Isi maklumat dan tanda kunci yang diperlukan. Permohonan anda akan diterima oleh petugas.</p>

  <div class="card" id="formCard">
    <label class="f" for="nama">Nama penuh *</label>
    <input id="nama" type="text" maxlength="80" autocomplete="name">

    <label class="f" for="tel">Nombor telefon *</label>
    <input id="tel" type="tel" inputmode="tel" maxlength="20" placeholder="cth: 012-3456789" autocomplete="tel">

    <label class="f" for="kelabSel">Kelab *</label>
    <select id="kelabSel"><option value="">— Pilih kelab —</option></select>
    <input id="kelabLain" class="hidden" type="text" maxlength="80" placeholder="Taip nama kelab" style="margin-top:8px">

    <label class="f">Pilih kunci yang diperlukan * <small>(tekan kad untuk tanda)</small></label>
    <div class="kgrid" id="kgrid"><div class="mute">Memuatkan senarai kunci…</div></div>
    <div class="mute" id="ksum" style="margin-top:8px;font-size:.9rem"></div>
    <div id="manualWrap" class="hidden">
      <label class="f" for="kunciManual">Nama kunci yang diperlukan</label>
      <input id="kunciManual" type="text" maxlength="200" placeholder="cth: Kunci Bilik Mesyuarat">
    </div>

    <label class="f" for="tarikh">Tarikh ambil *</label>
    <input id="tarikh" type="date">

    <label class="f" for="tujuan">Tujuan <small>(pilihan)</small></label>
    <textarea id="tujuan" maxlength="200" placeholder="cth: Latihan persembahan"></textarea>

    <input class="hp" id="website" type="text" tabindex="-1" autocomplete="off" aria-hidden="true">

    <button class="go" id="send" type="button">📨 Hantar Permohonan</button>
    <div class="msg" id="msg"></div>
  </div>

  <div class="card ok hidden" id="doneCard">
    <div class="big">✅</div>
    <h2>Permohonan dihantar</h2>
    <p class="sub">Terima kasih. Petugas akan menghubungi anda jika perlu.</p>
    <button class="go" id="again" type="button">Hantar permohonan lain</button>
  </div>
</main>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
var firebaseConfig = {
  apiKey: "AIzaSyBRdD5GyXVf6JE0EU6MhrW7t2mz8eosPu0",
  authDomain: "barang-pelupusan-59e3b.firebaseapp.com",
  projectId: "barang-pelupusan-59e3b",
  storageBucket: "barang-pelupusan-59e3b.firebasestorage.app",
  messagingSenderId: "158901253592",
  appId: "1:158901253592:web:c1aad6554a062da0b66ead"
};
(function(){
  var $=function(id){return document.getElementById(id);};
  function pad(n){return String(n).padStart(2,'0');}
  function today(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
  function esc(s){var d=document.createElement('div');d.textContent=s==null?'':String(s);return d.innerHTML;}
  function say(t,bad){var m=$('msg');m.textContent=t||'';m.className='msg'+(bad?' err':'');}
  $('tarikh').value=today();

  var keys=[],clubs=[],taken={},sel={},listOk=false,db;

  /* ---------- kelab ---------- */
  function renderClubs(){
    var s=$('kelabSel'),cur=s.value;
    s.innerHTML='';
    function opt(v,t){var o=document.createElement('option');o.value=v;o.textContent=t;s.appendChild(o);}
    opt('','— Pilih kelab —');
    clubs.slice().sort(function(a,b){return (a.nama||'').localeCompare(b.nama||'');}).forEach(function(c){opt(c.nama,c.nama);});
    opt('Individu','Individu / Tiada kelab');
    opt('__lain','Lain-lain (taip sendiri)…');
    s.value=cur;if(s.value!==cur)s.value='';
    toggleLain();
  }
  function toggleLain(){var on=$('kelabSel').value==='__lain';$('kelabLain').classList.toggle('hidden',!on);if(on)$('kelabLain').focus();}
  $('kelabSel').addEventListener('change',toggleLain);

  /* ---------- kunci ---------- */
  function selList(){return keys.filter(function(k){return sel[k.kid];});}
  function sumText(){
    var l=selList();
    $('ksum').innerHTML=l.length?('Dipilih ('+l.length+'): <strong>'+l.map(function(k){return esc(k.nama);}).join(', ')+'</strong>'):'';
  }
  function renderKeys(){
    var g=$('kgrid');
    Object.keys(sel).forEach(function(id){if(taken[id]||!keys.some(function(k){return k.kid===id;}))delete sel[id];});
    if(!listOk||!keys.length){
      g.innerHTML=listOk?'<div class="mute">Belum ada kunci dalam senarai.</div>':'<div class="mute">Memuatkan senarai kunci…</div>';
      $('manualWrap').classList.toggle('hidden',!(listOk&&!keys.length)&&!window.__listFail);
      sumText();return;
    }
    $('manualWrap').classList.add('hidden');
    g.innerHTML='';
    keys.slice().sort(function(a,b){return (a.nama||'').localeCompare(b.nama||'');}).forEach(function(k){
      var off=!!taken[k.kid],on=!!sel[k.kid];
      var d=document.createElement('div');d.className='kcard'+(off?' off':'')+(on?' sel':'');
      d.innerHTML=(k.thumb?'<img src="'+k.thumb+'" alt="">':'<div class="noimg">🔑</div>')+
        '<div class="kn"><b>'+esc(k.nama)+'</b>'+(off?'<small>Sedang dipinjam</small>':'<small class="ok2">Tersedia</small>')+'</div>'+
        '<input type="checkbox" class="kchk" tabindex="-1" aria-label="Pilih"'+(on?' checked':'')+(off?' disabled':'')+'>';
      d.onclick=function(){if(off)return;if(sel[k.kid])delete sel[k.kid];else sel[k.kid]=true;renderKeys();};
      g.appendChild(d);
    });
    sumText();
  }

  try{
    firebase.initializeApp(firebaseConfig);db=firebase.firestore();
    db.collection('kunci_senarai').onSnapshot(function(sn){
      var all=sn.docs.map(function(d){var o=d.data();o.id=d.id;return o;});
      keys=all.filter(function(x){return x.jenis!=='kelab';});
      clubs=all.filter(function(x){return x.jenis==='kelab';});
      listOk=true;window.__listFail=false;renderKeys();renderClubs();
    },function(){listOk=true;window.__listFail=true;keys=[];renderKeys();});
    db.collection('kunci_status').onSnapshot(function(sn){
      taken={};sn.docs.forEach(function(d){var o=d.data();if(o.dipinjam)taken[o.kid]=true;});
      renderKeys();
    },function(){});
  }catch(e){say('Sistem gagal dimuatkan. Semak internet dan cuba lagi.',true);$('send').disabled=true;}

  /* ---------- hantar ---------- */
  $('send').onclick=function(){
    if($('website').value)return;
    var nama=$('nama').value.trim(),tel=($('tel').value||'').replace(/[^\d+\-\s()]/g,'').trim();
    var kl=$('kelabSel').value,tarikh=$('tarikh').value,tujuan=$('tujuan').value.trim();
    if(!nama){say('Sila isi nama penuh.',true);$('nama').focus();return;}
    if(tel.replace(/\D/g,'').length<9){say('Sila isi nombor telefon yang sah.',true);$('tel').focus();return;}
    if(kl==='__lain'){kl=$('kelabLain').value.trim();if(!kl){say('Sila taip nama kelab.',true);$('kelabLain').focus();return;}}
    else if(!kl){say('Sila pilih kelab (atau Individu / Tiada kelab).',true);$('kelabSel').focus();return;}
    var chosen=selList(),kunci='',kids=[];
    if(chosen.length){kunci=chosen.map(function(k){return k.nama;}).join(', ').slice(0,300);kids=chosen.map(function(k){return k.kid;}).slice(0,10);}
    else if(!$('manualWrap').classList.contains('hidden')){kunci=$('kunciManual').value.trim();}
    if(!kunci){say('Sila tanda sekurang-kurangnya satu kunci.',true);return;}
    if(!tarikh){say('Sila pilih tarikh ambil.',true);return;}
    var last=0;try{last=parseInt(localStorage.getItem('borang:last')||'0',10)||0;}catch(e){}
    if(Date.now()-last<20000){say('Sila tunggu sebentar sebelum menghantar lagi.',true);return;}
    var b=$('send');b.disabled=true;say('Menghantar…');
    db.collection('permohonan').add({
      nama:nama,telefon:tel,kelab:kl,kunci:kunci,kids:kids,tarikh:tarikh,tujuan:tujuan,
      status:'baru',ts:firebase.firestore.FieldValue.serverTimestamp()
    }).then(function(){
      try{localStorage.setItem('borang:last',String(Date.now()));}catch(e){}
      $('formCard').classList.add('hidden');$('doneCard').classList.remove('hidden');say('');
    }).catch(function(e){
      say((e&&e.code==='permission-denied')?'Maaf, permohonan tidak dapat dihantar sekarang. Sila hubungi petugas.':'Gagal menghantar. Semak internet dan cuba lagi.',true);
    }).then(function(){b.disabled=false;});
  };

  $('again').onclick=function(){
    sel={};['tujuan','kunciManual'].forEach(function(id){$(id).value='';});
    $('tarikh').value=today();renderKeys();
    $('doneCard').classList.add('hidden');$('formCard').classList.remove('hidden');
  };
})();
</script>
</body>
</html>
